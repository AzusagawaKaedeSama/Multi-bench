<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>D 盘迁移筛选台</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1f;--dim:#77736b;--line:#dedad2;--acc:#2d5bc2;--ok:#1f8a4c;--warn:#c2412d;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#ecebe8;--dim:#9a968e;--line:#33322f;--card:#232326;--acc:#6f9bff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
aside{width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{flex:1;overflow:auto;padding:8px 16px 20px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:1px solid transparent}
.row:hover{background:var(--card)}
.row.on{border-color:var(--acc);background:var(--card)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);flex:0 0 auto}
.meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:56px;text-align:right;flex:0 0 auto}
.sz{font-variant-numeric:tabular-nums;min-width:80px;text-align:right;flex:0 0 auto}
button{padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;font-size:13px}
button:hover:not(:disabled){border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
.stat{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.log{margin:0 16px 16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
     font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:300px;overflow:auto;white-space:pre-wrap;display:none}
.hint{color:var(--dim);font-size:12px;padding:0 16px 12px}
code{font-size:11px;word-break:break-all}
</style></head><body>

<aside>
  <div class="stat" style="font-weight:600">D 盘迁移筛选台</div>
  <div class="stat">
    已选 <b id="n">0</b> 个项目<br>
    <span style="color:var(--dim)">将释放 <b id="gb" style="font-size:15px">0 GiB</b></span>
  </div>
  <div class="stat">
    <span style="color:var(--dim)">目标盘</span><br>
    <code>E:\_Archive_2-视频制作_20261021</code>
  </div>
  <div style="padding:12px;display:flex;flex-direction:column;gap:8px">
    <button id="bRec">选中建议项</button>
    <button id="bAll">全选</button>
    <button id="bNone">全不选</button>
  </div>
  <div class="stat" style="margin-top:auto;border-top:1px solid var(--line);border-bottom:none;color:var(--dim);font-size:12px">
    勾选自动保存<br><span id="saved">加载中…</span>
  </div>
</aside>

<main>
  <div class="toolbar">
    <button id="bDry">预演（不碰文件）</button>
    <button id="bRun" class="primary">执行迁移</button>
    <span style="flex:1"></span>
    <span style="color:var(--dim);font-size:12px" id="runstatus"></span>
  </div>
  <div class="hint">规则：复制 → 逐文件 SHA-256 校验 → 全部通过才删源；目标已存在则跳过、源保留。失败保留源。</div>
  <div class="list" id="list"></div>
  <pre class="log" id="log"></pre>
</main>

<script>
var CAND = [], STATE = { select: {} };
function $(id){ return document.getElementById(id); }
function human(mb){ return mb >= 1024 ? (mb/1024).toFixed(1)+' GiB' : mb+' MiB'; }
function daysTxt(d){ return d <= 0 ? '今天' : d+' 天前'; }

function load(){
  fetch('/api/candidates').then(function(r){ return r.json(); }).then(function(c){
    CAND = c;
    return fetch('/api/state');
  }).then(function(r){ return r.json(); }).then(function(s){
    STATE = s;
    if (STATE.updated) $('saved').textContent = '上次保存 ' + new Date(STATE.updated).toLocaleTimeString();
    render();
    poll();
  });
}

function render(){
  var list = $('list');
  list.innerHTML = '';
  var rows = CAND.slice().sort(function(a,b){ return b.days - a.days; });
  var n = 0, mb = 0;
  rows.forEach(function(c){
    var on = !!STATE.select[c.name];
    if (on) { n++; mb += c.mb; }
    var el = document.createElement('label');
    el.className = 'row' + (on ? ' on' : '');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = on;
    var nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = c.name; nm.title = c.name;
    var bd = document.createElement('span');
    bd.className = 'badge'; bd.textContent = c.kind;
    var mt = document.createElement('span');
    mt.className = 'meta'; mt.textContent = daysTxt(c.days);
    var sz = document.createElement('span');
    sz.className = 'sz'; sz.textContent = human(c.mb);
    el.appendChild(cb); el.appendChild(nm); el.appendChild(bd); el.appendChild(mt); el.appendChild(sz);
    cb.addEventListener('change', function(){
      mark(c.name, cb.checked);
    });
    list.appendChild(el);
  });
  $('n').textContent = n;
  $('gb').textContent = human(mb);
}

function mark(name, on){
  return fetch('/api/mark', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ name: name, on: on })
  }).then(function(r){ return r.json(); }).then(function(s){
    STATE = s;
    $('saved').textContent = '已保存 ' + new Date().toLocaleTimeString();
    render();
  });
}

function bulk(which){
  fetch('/api/bulk', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ which: which })
  }).then(function(r){ return r.json(); }).then(function(s){
    STATE = s;
    $('saved').textContent = '已保存 ' + new Date().toLocaleTimeString();
    render();
  });
}

function run(mode){
  $('bRun').disabled = true; $('bDry').disabled = true;
  $('log').style.display = 'block';
  $('log').textContent = '启动中…';
  fetch('/api/run', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ mode: mode })
  }).then(function(r){ return r.text(); }).then(function(t){
    poll();
  });
}

function poll(){
  fetch('/api/run/status').then(function(r){ return r.json(); }).then(function(R){
    var label = { idle:'', dry:'预演中…', running:'迁移中…', done:'完成 ✓', failed:'失败 ✗' }[R.phase] || '';
    $('runstatus').textContent = label;
    if (R.log) {
      $('log').style.display = 'block';
      $('log').textContent = R.log;
      $('log').scrollTop = $('log').scrollHeight;
    }
    var busy = (R.phase === 'dry' || R.phase === 'running');
    $('bRun').disabled = busy; $('bDry').disabled = busy;
    if (busy) setTimeout(poll, 900);
  });
}

$('bDry').addEventListener('click', function(){ run('dry'); });
$('bRun').addEventListener('click', function(){
  var n = $('n').textContent;
  if (!confirm('确认迁移 ' + n + ' 个项目到 E 盘？\n\n规则：复制→SHA256校验→通过才删源。')) return;
  run('apply');
});
$('bRec').addEventListener('click', function(){ bulk('rec'); });
$('bAll').addEventListener('click', function(){ bulk('all'); });
$('bNone').addEventListener('click', function(){ bulk('none'); });

load();
</script>
</body></html>
